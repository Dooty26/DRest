services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant_local
    ports:
      - "5432:5432"
    volumes:
      - restaurant-postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U restaurant -d restaurant" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  restaurant-postgres:
